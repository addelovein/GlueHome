name: Offline and ESPHome checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        python: ['3.10', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install -r requirements.txt
      - run: python tools/glue.py test
      - run: python -m unittest discover -s tests -v
      - run: g++ -std=c++17 -DUSE_ESP32 -fsanitize=address,undefined -Itests/host tests/host/test_lock.cpp -o /tmp/glue-tests && /tmp/glue-tests
  esphome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install --upgrade 'esphome>=2026.9.1'
      - run: python tools/validate_esphome.py --compile
