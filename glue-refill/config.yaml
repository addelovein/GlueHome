# Home Assistant local add-on: Glue key-refill worker.
# Runs tools/glue.py sync --watch in a supervised container. Holds Glue account
# credentials and refills the ESP32's single-use key bank over HA's API. The
# ESP32 itself never holds credentials and never touches the cloud.
name: Glue key-refill worker
version: "0.2.3"
slug: glue_refill
description: Refills the ESPHome Glue lock's single-use key pool via Home Assistant.
arch:
  - aarch64
  - amd64
  - armv7
# run.sh is a plain bash script (not an s6 service), so run it as the container
# command directly instead of under s6-overlay (which must be PID 1).
init: false
# Needs network (Cognito) + the Home Assistant Core API proxy. homeassistant_api
# lets the worker reach HA at http://supervisor/core/api with SUPERVISOR_TOKEN —
# no manual url/token needed. No GPIO/USB/BLE: refill is network-only.
hassio_api: false
homeassistant_api: true
host_network: false
# /data persists across restarts/updates — the encrypted store, key bank and
# controller-ownership record live here. The data directory is always mapped and
# writable, so no explicit map entry is needed.
options:
  # HA access is automatic via the Supervisor proxy; leave ha_url/ha_token blank
  # unless pointing at a non-add-on HA. Fill in the lock + Glue login below.
  ha_device: "gluelock-esp32"
  ha_bank_entity: "sensor.gluelock_esp32_glue_bank_status"
  lock_id: ""
  lock_serial: ""
  glue_username: ""
  interval_seconds: 30
  log_level: "info"
schema:
  # Secrets are write-only in the UI; never commit them. ha_url/ha_token are
  # OPTIONAL (trailing ?) — omit them to use the Supervisor's Core API proxy.
  ha_url: "url?"
  ha_token: "password?"
  # ESPHome node name: lowercase letters/digits with hyphens or underscores
  # (ESPHome slugs commonly use underscores, e.g. kontoret_glue_...).
  ha_device: "match(^[a-z0-9][a-z0-9_-]*$)"
  ha_bank_entity: "match(^sensor\\.[a-z0-9_]+$)"
  lock_id: "match(^[0-9a-fA-F-]{36}$)"
  lock_serial: "str"
  glue_username: "str"
  glue_password: "password"
  storage_key: "password"
  interval_seconds: "int(5,3600)"
  log_level: "list(debug|info|warning|error)"
